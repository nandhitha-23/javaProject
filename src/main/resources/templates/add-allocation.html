<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${allocation.id == null ? 'New Lab Allocation' : 'Edit Allocation'} + ' | Smart Lab Allocation'">Lab Allocation | Smart Lab Allocation</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<div class="app-shell">

    <!-- Reusable Sidebar Navigation -->
    <div th:replace="~{fragments/navigation :: sidebar(activePage='new-allocation')}"></div>

    <!-- Main Content -->
    <main class="app-main">

        <!-- Page Header -->
        <header class="page-header">
            <div class="page-title">
                <h1 th:text="${allocation.id == null ? 'Schedule Laboratory Allocation' : 'Edit Laboratory Allocation'}">
                    Lab Allocation Form
                </h1>
                <p>Assign a student to an available lab and reserve the required time slot.</p>
            </div>
            <div>
                <a th:href="@{/allocations}" class="btn btn-secondary">
                    ← Back to Allocations
                </a>
            </div>
        </header>

        <!-- Form Panel -->
        <section class="card-panel" style="max-width: 650px;">
            <div class="panel-header">
                <h2 class="panel-title" th:text="${allocation.id == null ? '📅 New Reservation' : '✏ Edit Reservation'}">
                    Allocation Details
                </h2>
                <span th:if="${allocation.id != null}" class="badge badge-purple" th:text="'Allocation #' + ${allocation.id}">#1</span>
            </div>

            <form th:action="@{/allocations/save}"
                  th:object="${allocation}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <!-- Student Selection -->
                <div class="form-group">
                    <label class="form-label" for="student">Select Student</label>
                    <select id="student"
                            th:field="*{student.studentId}"
                            class="form-control"
                            required>
                        <option value="">-- Choose Enrolled Student --</option>
                        <option th:each="student : ${students}"
                                th:value="${student.studentId}"
                                th:text="${student.studentName + ' (' + student.rollNo + ' - ' + student.department + ')'}">
                            Student Name
                        </option>
                    </select>
                </div>

                <!-- Lab Selection -->
                <div class="form-group">
                    <label class="form-label" for="lab">Select Laboratory</label>
                    <select id="lab"
                            th:field="*{lab.id}"
                            class="form-control"
                            required>
                        <option value="">-- Choose Laboratory Facility --</option>
                        <option th:each="lab : ${labs}"
                                th:value="${lab.id}"
                                th:text="${lab.labName + ' (' + lab.location + ' - ' + lab.capacity + ' Seats)'}">
                            Lab Name
                        </option>
                    </select>
                </div>

                <!-- Allocation Date -->
                <div class="form-group">
                    <label class="form-label" for="allocationDate">Allocation Date</label>
                    <input type="date"
                           id="allocationDate"
                           th:field="*{allocationDate}"
                           class="form-control"
                           required>
                </div>

                <!-- Time Grid -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label class="form-label" for="startTime">Start Time</label>
                        <input type="time"
                               id="startTime"
                               th:field="*{startTime}"
                               class="form-control"
                               required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="endTime">End Time</label>
                        <input type="time"
                               id="endTime"
                               th:field="*{endTime}"
                               class="form-control"
                               required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <span>Confirm & Save Allocation</span>
                    </button>
                    <a th:href="@{/allocations}" class="btn btn-secondary">
                        Cancel
                    </a>
                </div>

            </form>
        </section>

    </main>

</div>

</body>
</html>
