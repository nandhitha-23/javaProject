<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Availability Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: 20px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #1d4ed8;
            text-align: center;
        }

        .back-button {
            display: inline-block;
            background: #475569;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 6px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            color: #b91c1c;
            background: #fee2e2;
            padding: 12px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .results {
            margin-top: 30px;
        }

        .lab-card {
            border: 1px solid #e2e8f0;
            border-left: 5px solid #16a34a;
            padding: 16px;
            margin-top: 12px;
            border-radius: 8px;
        }

        .available {
            color: #15803d;
            font-weight: bold;
        }

        .empty {
            background: #fef3c7;
            padding: 15px;
            border-radius: 6px;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="/" class="back-button">← Back</a>

    <h1>🔍 Lab Availability Checker</h1>

    <p>
        Select a date and time to find laboratories available
        for your requested time slot.
    </p>

    <form th:action="@{/lab-availability}" method="get">

        <div class="form-grid">

            <div>
                <label for="date">Select Date</label>
                <input type="date"
                       id="date"
                       name="date"
                       th:value="${date}"
                       required>
            </div>

            <div>
                <label for="startTime">Start Time</label>
                <input type="time"
                       id="startTime"
                       name="startTime"
                       th:value="${startTime}"
                       required>
            </div>

            <div>
                <label for="endTime">End Time</label>
                <input type="time"
                       id="endTime"
                       name="endTime"
                       th:value="${endTime}"
                       required>
            </div>

        </div>

        <button type="submit">Check Availability</button>

    </form>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <div class="results" th:if="${searched}">

        <h2>Available Laboratories</h2>

        <div th:if="${#lists.isEmpty(labs)}" class="empty">
            No laboratories are available for the selected date and time.
        </div>

        <div th:each="lab : ${labs}" class="lab-card">

            <h3 th:text="${lab.labName}">Laboratory Name</h3>

            <p>
                <strong>Location:</strong>
                <span th:text="${lab.location}">Location</span>
            </p>

            <p>
                <strong>Capacity:</strong>
                <span th:text="${lab.capacity}">0</span>
            </p>

            <p class="available">✓ Available</p>

        </div>

    </div>

</div>

</body>
</html>
