<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Lab Allocations</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background-color: #f4f6f9;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #cccccc;
        }

        .add-button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        .edit {
            color: #007bff;
            text-decoration: none;
        }

        .delete {
            color: #dc3545;
            text-decoration: none;
        }

        .success {
            color: green;
            margin-bottom: 15px;
        }

        .error {
            color: red;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Lab Allocation Management</h2>

    <p class="success"
       th:if="${successMessage}"
       th:text="${successMessage}">
    </p>

    <p class="error"
       th:if="${errorMessage}"
       th:text="${errorMessage}">
    </p>

    <a class="add-button"
       th:href="@{/allocations/add}">
        + Add New Allocation
    </a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Lab</th>
            <th>Date</th>
            <th>Start Time</th>
            <th>End Time</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="allocation : ${allocations}">

            <td th:text="${allocation.id}"></td>

            <td th:text="${allocation.student.studentName}"></td>

            <td th:text="${allocation.lab.labName}"></td>

            <td th:text="${allocation.allocationDate}"></td>

            <td th:text="${allocation.startTime}"></td>

            <td th:text="${allocation.endTime}"></td>

            <td>
                <a class="edit"
                   th:href="@{/allocations/edit/{id}(id=${allocation.id})}">
                    Edit
                </a>

                |

                <a class="delete"
                   th:href="@{/allocations/delete/{id}(id=${allocation.id})}"
                   onclick="return confirm('Delete this allocation?');">
                    Delete
                </a>
            </td>

        </tr>

        <tr th:if="${#lists.isEmpty(allocations)}">
            <td colspan="7">No allocations found.</td>
        </tr>

        </tbody>
    </table>

    <br>

    <a th:href="@{/students}">Student Management</a>
    |
    <a th:href="@{/labs}">Lab Management</a>

</div>

</body>
</html>
