<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f6f9;
        }

        h1 {
            color: #243b55;
            text-align: center;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        .add-btn {
            display: inline-block;
            background: #198754;
            color: white;
            padding: 10px 16px;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #243b55;
            color: white;
        }

        .edit-btn {
            color: #0d6efd;
        }

        .delete-btn {
            color: #dc3545;
        }

        .message {
            color: green;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Lab Management</h1>

    <p class="message" th:if="${successMessage}"
       th:text="${successMessage}"></p>

    <a class="add-btn" th:href="@{/labs/add}">+ Add New Lab</a>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Lab Name</th>
            <th>Location</th>
            <th>Capacity</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="lab : ${labs}">
            <td th:text="${lab.id}"></td>
            <td th:text="${lab.labName}"></td>
            <td th:text="${lab.location}"></td>
            <td th:text="${lab.capacity}"></td>
            <td>
                <a class="edit-btn"
                   th:href="@{/labs/edit/{id}(id=${lab.id})}">Edit</a>

                |

                <a class="delete-btn"
                   th:href="@{/labs/delete/{id}(id=${lab.id})}"
                   onclick="return confirm('Are you sure you want to delete this lab?')">
                    Delete
                </a>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(labs)}">
            <td colspan="5">No labs available. Please add a lab.</td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
