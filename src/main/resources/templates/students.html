<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1, h2 {
            color: #243b55;
        }

        input {
            display: block;
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            background: #2463eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b55;
            color: white;
        }

        .message {
            margin: 10px 0;
            padding: 10px;
            background: #e1f7e8;
            color: #176b35;
        }

        .error {
            background: #ffe5e5;
            color: #a00000;
        }

        .delete-button {
            background: #dc2626;
        }
        .edit-button {
    display: inline-block;
    padding: 10px 18px;
    background: #16a34a;
    color: white;
    text-decoration: none;
    border-radius: 5px;
    margin-right: 5px;
}
    </style>
</head>

<body>
<div class="container">

    <h1>Smart Lab Allocation Management System</h1>
    <h2>Student Management</h2>

    <p class="message"
       th:if="${successMessage}"
       th:text="${successMessage}"></p>

    <p class="message error"
       th:if="${errorMessage}"
       th:text="${errorMessage}"></p>

    <h2>Add Student</h2>

    <form th:action="@{/students/add}"
          th:object="${student}"
          method="post">

        <input type="text"
               th:field="*{studentName}"
               placeholder="Student Name"
               required>

        <input type="text"
               th:field="*{rollNo}"
               placeholder="Roll Number"
               required>

        <input type="text"
               th:field="*{department}"
               placeholder="Department"
               required>

        <button type="submit">Add Student</button>
    </form>

    <h2>Student List</h2>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll Number</th>
            <th>Department</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="s : ${students}">
            <td th:text="${s.studentId}"></td>
            <td th:text="${s.studentName}"></td>
            <td th:text="${s.rollNo}"></td>
            <td th:text="${s.department}"></td>
            <td>
    <a th:href="@{/students/edit/{id}(id=${s.studentId})}"
       class="edit-button">
        Edit
    </a>

    <form th:action="@{/students/delete/{id}(id=${s.studentId})}"
          method="post"
          style="display: inline;"
          onsubmit="return confirm('Are you sure you want to delete this student?');">

        <button type="submit" class="delete-button">
            Delete
        </button>
    </form>
</td>
        </tr>

        <tr th:if="${#lists.isEmpty(students)}">
            <td colspan="5">No students added yet.</td>
        </tr>
        </tbody>
    </table>

</div>
</body>
</html>
